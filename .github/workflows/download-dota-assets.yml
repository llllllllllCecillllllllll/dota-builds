name: Download Dota 2 item assets
on:
  push:
    branches: [dev/v1.03]
    paths:
      - '.github/workflows/download-dota-assets.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: dev/v1.03

      - name: Download official Dota assets
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/CaptchaQ/dota2-assets-downloader.git downloader
          ./downloader/download_dota_assets.ps1 -OutputRoot "$PWD/dota_download" -SkipHeroes -SkipAbilities -SkipHeroLegacy -SkipAbilitiesLegacy -SkipItemsLegacy

      - name: Build local item catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/items
          find dota_download/abilities_items -type f -name 'item_*.png' -exec cp -f {} assets/items/ \; || true
          curl -fsSL --compressed -A 'DotaAssistant/1.03 asset importer' 'https://raw.githubusercontent.com/DotaFlow/steam_api_dumps/master/web/items/_ItemsList.json' -o /tmp/itemslist.json
          python3 - <<'PY'
          import json, os, re
          root='dota_download/data'
          items_file=os.path.join(root,'opendota_items.json')
          items=json.load(open(items_file,encoding='utf-8')) if os.path.exists(items_file) else {}
          dump=json.load(open('/tmp/itemslist.json',encoding='utf-8'))
          rows=dump.get('result',{}).get('data',{}).get('itemabilities',[])
          neutral_names=set()
          for r in rows:
              if int(r.get('neutral_item_tier',-1))>=0 and r.get('name_loc'):
                  neutral_names.add(r['name_loc'])
          catalog={"Другое":[],"Нейтральные":[],"Зачарования":[]}
          def slug(s):
              s=s.lower().replace("'",'').replace('&','and')
              return re.sub(r'[^a-z0-9]+','_',s).strip('_')
          for v in (items.values() if isinstance(items,dict) else items):
              name=v.get('dname') or v.get('name','').replace('item_','').replace('_',' ')
              if not name: continue
              cat='Нейтральные' if name in neutral_names else 'Другое'
              if name not in catalog[cat]: catalog[cat].append(name)
          for name in sorted(neutral_names,key=lambda x:x.lower()):
              if name not in catalog['Нейтральные']: catalog['Нейтральные'].append(name)
          for k in catalog: catalog[k]=sorted(set(catalog[k]),key=lambda x:x.lower())
          with open('assets/catalog.js','w',encoding='utf-8') as f:
              f.write('window.DOTA_EXTRA_CATALOG='+json.dumps(catalog,ensure_ascii=False,separators=(',',':'))+';\n')
          old='assets/manifest.json'
          manifest={'heroes':{},'items':{}}
          for v in (items.values() if isinstance(items,dict) else items):
              name=v.get('dname') or v.get('name','').replace('item_','').replace('_',' ')
              internal=v.get('name','').replace('item_','')
              if not name or not internal: continue
              for fn in [f'item_{internal}.png',f'item_{slug(internal)}.png']:
                  if os.path.exists(os.path.join('assets/items',fn)):
                      manifest['items'][name]='items/'+fn
                      break
          if os.path.exists(old):
              try:
                  prev=json.load(open(old,encoding='utf-8'))
                  for k,v in prev.get('heroes',{}).items(): manifest['heroes'].setdefault(k,v)
                  for k,v in prev.get('items',{}).items(): manifest['items'].setdefault(k,v)
              except Exception: pass
          with open(old,'w',encoding='utf-8') as f: json.dump(manifest,f,ensure_ascii=False,indent=2)
          print('Items in manifest:',len(manifest['items']))
          print('Neutral items:',len(catalog['Нейтральные']))
          PY

      - name: Download neutral enchantment icons from Liquipedia Commons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/items/enchantments
          curl -fsSL --compressed -A 'DotaAssistant/1.03 asset importer' 'https://liquipedia.net/commons/api.php?action=query&list=categorymembers&cmtitle=Category:Dota_2_neutral_item_enchantments_icons&cmlimit=500&format=json' -o /tmp/enchantment_category.json
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse
          api='https://liquipedia.net/commons/api.php'
          members=json.load(open('/tmp/enchantment_category.json',encoding='utf-8')).get('query',{}).get('categorymembers',[])
          catalog=[]
          for m in members:
              title=m.get('title','')
              if not title.startswith('File:'): continue
              q=api+'?'+urllib.parse.urlencode({'action':'query','titles':title,'prop':'imageinfo','iiprop':'url','format':'json'})
              raw=subprocess.check_output(['curl','-fsSL','--compressed','-A','DotaAssistant/1.03 asset importer',q],text=True)
              pages=json.loads(raw).get('query',{}).get('pages',{})
              info=(next(iter(pages.values()),{}).get('imageinfo') or [{}])[0]
              url=info.get('url')
              if not url: continue
              name=title[5:].replace(' icon.png','').replace(' Enchantment itemicon dota2 gameasset.png','').replace(' Enchantment icon.png','')
              safe=name.lower().replace(' ','_').replace("'",'')
              out='assets/items/enchantments/'+safe+'.png'
              try:
                  subprocess.run(['curl','-fsSL','--compressed','-A','DotaAssistant/1.03 asset importer','-L',url,'-o',out],check=True)
                  catalog.append((name,'items/enchantments/'+safe+'.png'))
              except subprocess.CalledProcessError as e:
                  print('skip',title,e)
          with open('assets/enchantments.json','w',encoding='utf-8') as f: json.dump(catalog,f,ensure_ascii=False,indent=2)
          print('Downloaded enchantments:',len(catalog))
          PY

      - name: Commit downloaded assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/catalog.js assets/enchantments.json assets/manifest.json assets/items
          if git diff --cached --quiet; then echo 'No asset changes'; exit 0; fi
          git commit -m 'Add complete Dota item, neutral and enchantment assets'
          git push origin HEAD:dev/v1.03
