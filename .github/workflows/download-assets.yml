name: Download Dota assets

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent asset writers from racing on main.
concurrency:
  group: dota-assistant-assets-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Dota 2 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/heroes assets/items
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          root=Path('assets')
          headers={'User-Agent':'Dota-Assistant asset updater'}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read()

          base='https://cdn.cloudflare.steamstatic.com'
          heroes=json.loads(get('https://raw.githubusercontent.com/odota/dotaconstants/master/build/heroes.json'))
          items=json.loads(get('https://raw.githubusercontent.com/odota/dotaconstants/master/build/items.json'))

          hero_map={}
          for h in heroes.values():
              name=h.get('localized_name')
              img=h.get('icon') or ''
              if not name or not img: continue
              path=img.split('?')[0]
              slug=Path(path).stem
              out=f'heroes/{slug}.png'
              try:
                  (root/out).write_bytes(get(base+path))
                  hero_map[name]=out
              except Exception as e:
                  print('hero failed',name,e)

          item_map={}
          for it in items.values():
              name=it.get('dname')
              img=it.get('img') or ''
              if not name or not img: continue
              path=img.split('?')[0]
              slug=Path(path).stem
              out=f'items/{slug}.png'
              try:
                  (root/out).write_bytes(get(base+path))
                  item_map[name]=out
              except Exception as e:
                  print('item failed',name,e)

          # Explicitly repair the newer names that may differ in the upstream data.
          forced_heroes={
              'Kez':'heroes/kez.png',
              'Largo':'heroes/largo.png',
              'Ringmaster':'heroes/ringmaster.png',
              'Underlord':'heroes/abyssal_underlord.png'
          }
          for name,path in forced_heroes.items():
              try:
                  (root/path).write_bytes(get(base+'/apps/dota2/images/dota_react/heroes/'+Path(path).name))
                  hero_map[name]=path
              except Exception as e:
                  print('forced hero failed',name,e)

          # Dota's current item name is "Yasha and Kaya"; the app displays "Kaya and Yasha".
          try:
              p='items/yasha_and_kaya.png'
              (root/p).write_bytes(get(base+'/apps/dota2/images/dota_react/items/yasha_and_kaya.png'))
              item_map['Yasha and Kaya']=p
              item_map['Kaya and Yasha']=p
          except Exception as e:
              print('forced item failed Kaya and Yasha',e)

          # Never expose Pup's Paws in the local manifest.
          item_map.pop("Pup's Paws",None)

          (root/'manifest.json').write_text(json.dumps({'heroes':hero_map,'items':item_map},ensure_ascii=False,indent=2),encoding='utf-8')
          print('heroes:',len(hero_map),'items:',len(item_map))
          PY

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The asset download changes the working tree. Autostash lets us
          # rebase onto a newer main commit before creating the asset commit.
          git pull --rebase --autostash origin main

          git add assets
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'Repair local Dota hero and item assets'
            git push origin HEAD:main
          fi
